services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: quickwork-backend:latest
    container_name: quickwork-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_ADDR=:8080
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root@123
      - DB_NAME=quickwork_db
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - quickwork-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: quickwork-frontend:latest
    container_name: quickwork-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - quickwork-net

  mysql:
    image: mysql:8.0
    container_name: quickwork-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: quickwork_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - quickwork-net

  redis:
    image: redis:7-alpine
    container_name: quickwork-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
    networks:
      - quickwork-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: quickwork-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      timeout: 5s
      retries: 5
    networks:
      - quickwork-net

networks:
  quickwork-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data: